name: Publish to Comfy Registry

on:
  push:
    branches: [main]
    paths: ['.github/release-history.json']
  workflow_dispatch:
    inputs:
      mode:
        description: Publish a prepared release or synchronize existing notes
        type: choice
        options: [publish, sync-notes]
        default: publish
      release_sha:
        description: Optional full prepared release commit SHA on main
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false
  queue: max

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'publish')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.release.outputs.release }}
      upload: ${{ steps.release.outputs.upload }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main before running release scripts
        env:
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_SHA_INPUT" ]] && [[ ! "$RELEASE_SHA_INPUT" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo '::error::release_sha must be a full commit SHA.'
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select the immutable release revision
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        run: python .github/scripts/release_notes.py prepare

  test-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.release == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare-release.outputs.sha }}

  publish-node:
    needs: [prepare-release, test-release]
    if: needs.prepare-release.outputs.upload == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the publishing CLI
        run: python -m pip install -r .github/requirements-release.txt
      - name: Publish the tested commit
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          COMFY_NODE_CHANGELOG: ${{ needs.prepare-release.outputs.body }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"

  create-release:
    needs: [prepare-release, test-release, publish-node]
    if: >-
      always() && !cancelled() && needs.prepare-release.outputs.release == 'true' &&
      needs.test-release.result == 'success' &&
      (needs.publish-node.result == 'success' || needs.publish-node.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Complete the GitHub Release and shared notes
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: python .github/scripts/release_notes.py create

  sync-release-notes:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'sync-notes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Sync existing Registry versions without uploading packages
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: python .github/scripts/release_notes.py sync
