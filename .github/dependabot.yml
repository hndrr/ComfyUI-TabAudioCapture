version: 2

updates:
  - package-ecosystem: pip
    directories:
      - /
      - /.github
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # Runtime constraints follow ComfyUI; routine version-update PRs stay disabled.
    open-pull-requests-limit: 0
    # Security PR severity is controlled by repository auto-triage rules.
    # Keep security updates separate so each dependency's impact is reviewed.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
