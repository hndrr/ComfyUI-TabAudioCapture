version: 2

updates:
  - package-ecosystem: pip
    directories:
      - /
      - /.github
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # Runtime constraints follow ComfyUI; only security fixes should raise them.
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
